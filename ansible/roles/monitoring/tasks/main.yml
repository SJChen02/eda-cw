---
# roles/monitoring/tasks/main.yml
# AlmaLinux/RHEL-style: native installs + systemd
# Installs node_exporter everywhere, Prometheus+Grafana only on monitoring hosts.

- name: Install prerequisite packages
  dnf:
    name:
      - curl
      - tar
      - gzip
      - ca-certificates
    state: present
    update_cache: yes
  become: true

# -------------------------
# node_exporter (ALL NODES)
# -------------------------
- name: Create node_exporter user
  user:
    name: node_exporter
    shell: /sbin/nologin
    system: true
    create_home: false
  become: true

- name: Download node_exporter tarball
  get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: "0644"
  become: true

- name: Extract node_exporter
  unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: true
  become: true

- name: Install node_exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    mode: "0755"
    remote_src: true
  become: true

- name: Create systemd unit for node_exporter
  copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Prometheus Node Exporter
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=node_exporter
      Group=node_exporter
      Type=simple
      ExecStart=/usr/local/bin/node_exporter
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd (node_exporter)
  systemd:
    daemon_reload: yes
  become: true

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    enabled: yes
    state: started
  become: true

# -----------------------------------------
# Prometheus + Grafana (MONITORING HOSTS)
# -----------------------------------------
- name: Install Prometheus and Grafana on monitoring hosts only
  when: inventory_hostname in groups['monitoring']
  block:
    - name: Create prometheus user
      user:
        name: prometheus
        shell: /sbin/nologin
        system: true
        create_home: false
      become: true

    - name: Create Prometheus directories
      file:
        path: "{{ item }}"
        state: directory
        owner: prometheus
        group: prometheus
        mode: "0755"
      loop:
        - /etc/prometheus
        - /var/lib/prometheus
      become: true

    - name: Download Prometheus tarball
      get_url:
        url: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
        dest: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        mode: "0644"
      become: true

    - name: Extract Prometheus
      unarchive:
        src: "/tmp/prometheus-{{ prometheus_version }}.tar.gz"
        dest: /tmp
        remote_src: true
      become: true

    - name: Install prometheus and promtool binaries
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        mode: "0755"
        remote_src: true
      loop:
        - prometheus
        - promtool
      become: true

    - name: Install Prometheus consoles and console_libraries
      copy:
        src: "/tmp/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
        dest: "/etc/prometheus/{{ item }}"
        owner: prometheus
        group: prometheus
        mode: "0755"
        remote_src: true
      loop:
        - consoles
        - console_libraries
      become: true

    - name: Write prometheus.yml (scrape all nodes node_exporter)
      copy:
        dest: /etc/prometheus/prometheus.yml
        owner: prometheus
        group: prometheus
        mode: "0644"
        content: |
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: "node"
              static_configs:
                - targets:
          {% for h in groups['all'] %}
                    - "{{ (hostvars[h].ansible_host | default(h)) }}:9100"
          {% endfor %}
      become: true

    - name: Create systemd unit for Prometheus
      copy:
        dest: /etc/systemd/system/prometheus.service
        mode: "0644"
        content: |
          [Unit]
          Description=Prometheus
          After=network-online.target
          Wants=network-online.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file=/etc/prometheus/prometheus.yml \
            --storage.tsdb.path=/var/lib/prometheus \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
      become: true

    - name: Reload systemd (prometheus)
      systemd:
        daemon_reload: yes
      become: true

    - name: Enable and start Prometheus
      systemd:
        name: prometheus
        enabled: yes
        state: started
      become: true

    # Grafana (official repo)
    - name: Add Grafana YUM repo
      yum_repository:
        name: grafana
        description: Grafana OSS
        baseurl: https://rpm.grafana.com
        repo_gpgcheck: yes
        gpgcheck: yes
        enabled: yes
        gpgkey: https://rpm.grafana.com/gpg.key
        sslverify: yes
      become: true

    - name: Install Grafana
      dnf:
        name: grafana
        state: present
        update_cache: yes
      become: true

    - name: Enable and start Grafana
      systemd:
        name: grafana-server
        enabled: yes
        state: started
      become: true
