---
# roles/host/tasks/main.yml

- name: Install RabbitMQ and Erlang repositories
  copy:
    dest: /etc/yum.repos.d/rabbitmq.repo
    content: |
      ##
      ## Erlang (RabbitMQ runtime)
      ##
      [modern-erlang]
      name=modern-erlang-el9
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/$basearch
              https://yum2.rabbitmq.com/erlang/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      [modern-erlang-noarch]
      name=modern-erlang-el9-noarch
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/noarch
              https://yum2.rabbitmq.com/erlang/el/9/noarch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      ##
      ## RabbitMQ Server
      ##
      [rabbitmq-el9]
      name=rabbitmq-el9
      baseurl=https://yum1.rabbitmq.com/rabbitmq/el/9/$basearch
              https://yum2.rabbitmq.com/rabbitmq/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md
  become: true

- name: Install RabbitMQ server
  dnf:
    name:
      - erlang
      - rabbitmq-server
    state: present
    update_cache: yes
  become: true

- name: Enable and start RabbitMQ
  systemd:
    name: rabbitmq-server
    enabled: yes
    state: started
  become: true

- name: Enable RabbitMQ management UI
  command: rabbitmq-plugins enable rabbitmq_management
  register: mgmt_res
  changed_when: "'Plugin configuration changed' in mgmt_res.stdout"
  failed_when: mgmt_res.rc != 0 and ('already enabled' not in (mgmt_res.stdout | lower))
  become: true

- name: Restart RabbitMQ if management UI changed
  systemd:
    name: rabbitmq-server
    state: restarted
  when: mgmt_res is changed
  become: true

#installing python
- name: Install Python runtime for dispatcher (host)
  dnf:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: yes
  become: true



# Install celery
- name: Install Celery on host (producer)
  pip:
    name: celery
    executable: pip3
  become: true

# Create celery vhost/user (so you don't rely on guest/guest remotely)
- name: Create celery vhost
  command: rabbitmqctl add_vhost /celery
  register: vhost_res
  failed_when: vhost_res.rc not in [0, 70]
  changed_when: vhost_res.rc == 0
  become: true

- name: Create celery user
  command: rabbitmqctl add_user celery celerypass
  register: user_res
  failed_when: user_res.rc not in [0, 70]
  changed_when: user_res.rc == 0
  become: true

- name: Set permissions for celery user
  command: rabbitmqctl set_permissions -p /celery celery ".*" ".*" ".*"
  become: true

# Admin user for RabbitMQ Management UI (separate from celery worker user)
- name: Create RabbitMQ admin user
  command: rabbitmqctl add_user admin 123
  register: admin_user_res
  failed_when: admin_user_res.rc not in [0, 70]
  changed_when: admin_user_res.rc == 0
  become: true

- name: Tag RabbitMQ admin user as administrator
  command: rabbitmqctl set_user_tags admin administrator
  become: true

- name: Set permissions for admin user on /
  command: rabbitmqctl set_permissions -p / admin ".*" ".*" ".*"
  become: true

- name: Set permissions for admin user on /celery
  command: rabbitmqctl set_permissions -p /celery admin ".*" ".*" ".*"
  become: true


# -------------------------------
# Protein pipeline dispatcher bits
# -------------------------------

- name: Create pipeline directory on host
  file:
    path: /opt/protein_pipeline
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"
  become: true

- name: Copy pipeline task module + dispatcher to host
  copy:
    src: "/home/almalinux/eda-cw/distributed/{{ item }}"
    dest: "/opt/protein_pipeline/{{ item }}"
    owner: almalinux
    group: almalinux
    mode: "0755"
  loop:
    - pipeline_tasks.py
    - task_dispatcher.py
  become: true

- name: Write protein-pipeline environment file on host
  copy:
    dest: /etc/sysconfig/protein-pipeline
    mode: "0644"
    content: |
      CELERY_BROKER_URL=amqp://celery:celerypass@{{ groups['host'][0] }}:5672/%2Fcelery
      PIPELINE_DIR=/opt/protein_pipeline
  become: true


