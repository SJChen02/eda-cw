---
# roles/host/tasks/main.yml

- name: Install RabbitMQ and Erlang repositories
  copy:
    dest: /etc/yum.repos.d/rabbitmq.repo
    content: |
      ##
      ## Erlang (RabbitMQ runtime)
      ##
      [modern-erlang]
      name=modern-erlang-el9
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/$basearch
              https://yum2.rabbitmq.com/erlang/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      [modern-erlang-noarch]
      name=modern-erlang-el9-noarch
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/noarch
              https://yum2.rabbitmq.com/erlang/el/9/noarch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      ##
      ## RabbitMQ Server
      ##
      [rabbitmq-el9]
      name=rabbitmq-el9
      baseurl=https://yum1.rabbitmq.com/rabbitmq/el/9/$basearch
              https://yum2.rabbitmq.com/rabbitmq/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md
  become: true

  #installing python
- name: Install Python runtime for dispatcher (host)
  dnf:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: yes
  become: true

- name: Upgrade pip 
  pip: 
    name: pip 
    state: latest 
    executable: pip3 
  become: true

# Install celery
- name: Install Celery on host (producer)
  pip:
    name: celery
    executable: pip3
  become: true

- name: Install Python packages on host (dispatcher deps)
  pip:
    name:
      - biopython
      - numpy
      - scipy
    executable: pip3
  become: true

- name: Install RabbitMQ server and tmux
  dnf:
    name:
      - erlang
      - rabbitmq-server
      - tmux
    state: present
    update_cache: yes
  become: true

- name: Enable and start RabbitMQ
  systemd:
    name: rabbitmq-server
    enabled: yes
    state: started
  become: true

- name: Enable RabbitMQ management UI
  command: rabbitmq-plugins enable rabbitmq_management
  register: mgmt_res
  changed_when: "'Plugin configuration changed' in mgmt_res.stdout"
  failed_when: mgmt_res.rc != 0 and ('already enabled' not in (mgmt_res.stdout | lower))
  become: true

- name: Restart RabbitMQ if management UI changed
  systemd:
    name: rabbitmq-server
    state: restarted
  when: mgmt_res is changed
  become: true

# Create celery vhost/user (so you don't rely on guest/guest remotely)
- name: Create celery vhost
  command: rabbitmqctl add_vhost /celery
  register: vhost_res
  failed_when: vhost_res.rc not in [0, 70]
  changed_when: vhost_res.rc == 0
  become: true

- name: Create celery user
  command: rabbitmqctl add_user celery celerypass
  register: user_res
  failed_when: user_res.rc not in [0, 70]
  changed_when: user_res.rc == 0
  become: true

- name: Set permissions for celery user
  command: rabbitmqctl set_permissions -p /celery celery ".*" ".*" ".*"
  become: true

# Admin user for RabbitMQ Management UI (separate from celery worker user)
- name: Create RabbitMQ admin user
  command: rabbitmqctl add_user admin 123
  register: admin_user_res
  failed_when: admin_user_res.rc not in [0, 70]
  changed_when: admin_user_res.rc == 0
  become: true

- name: Tag RabbitMQ admin user as administrator
  command: rabbitmqctl set_user_tags admin administrator
  become: true

- name: Set permissions for admin user on /
  command: rabbitmqctl set_permissions -p / admin ".*" ".*" ".*"
  become: true

- name: Set permissions for admin user on /celery
  command: rabbitmqctl set_permissions -p /celery admin ".*" ".*" ".*"
  become: true

#Copy protein FASTA to host
- name: Create protein data directory on host
  file:
    path: /data/proteins
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"
  become: true

- name: Copy protein FASTA to host
  copy:
    src: /home/almalinux/eda-cw/proteome/UP000000589_10090.fasta
    dest: /data/proteins/UP000000589_10090.fasta
    owner: almalinux
    group: almalinux
    mode: "0644"
  become: true


# -------------------------------
# Protein pipeline dispatcher bits
# -------------------------------

- name: Create pipeline directory on host
  file:
    path: /opt/protein_pipeline
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"
  become: true

- name: Copy pipeline task module + dispatcher to host
  copy:
    src: "/home/almalinux/eda-cw/distributed/{{ item }}"
    dest: "/opt/protein_pipeline/{{ item }}"
    owner: almalinux
    group: almalinux
    mode: "0755"
  loop:
    - pipeline_tasks.py
    - task_dispatcher.py
  become: true

- name: Write protein-pipeline environment file on host
  copy:
    dest: /etc/sysconfig/protein-pipeline
    mode: "0644"
    content: |
      CELERY_BROKER_URL=amqp://celery:celerypass@10.134.12.197:5672//celery
      PIPELINE_DIR=/opt/protein_pipeline
  become: true

#Copy experiment_ids.txt to host
- name: Copy experiment_ids.txt to host pipeline directory
  copy:
    src: /home/almalinux/eda-cw/experiment_ids.txt
    dest: /opt/protein_pipeline/experiment_ids.txt
    owner: almalinux
    group: almalinux
    mode: "0644"
  become: true

# --- Flower (Celery monitoring) installation --- 
- name: Ensure Python3 and pip are installed 
  yum: 
    name: 
      - python3 
      - python3-pip 
    state: present 
  become: true 

- name: Install Flower 
  pip: 
    name: flower 
    state: present 
    executable: pip3 
  become: true

# --- Flower systemd service + firewall ---

- name: Create flower systemd service file
  copy:
    dest: /etc/systemd/system/flower.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Flower Celery Monitoring
      After=network.target rabbitmq-server.service
      
      [Service]
      Type=simple
      User=almalinux
      EnvironmentFile=/etc/sysconfig/protein-pipeline
      WorkingDirectory=/opt/protein_pipeline
      ExecStart=/usr/bin/python3 -m flower --broker=${CELERY_BROKER_URL} --port=5555
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: true

- name: Ensure firewalld is installed and running
  yum:
    name: firewalld
    state: present
  become: true

- name: Start and enable firewalld
  systemd:
    name: firewalld
    state: started
    enabled: true
  become: true

- name: Open Flower port 5555 in firewall
  firewalld:
    port: 5555/tcp
    permanent: true
    state: enabled
    immediate: true
  become: true

- name: Enable and start Flower service
  systemd:
    name: flower
    state: started
    enabled: true
  become: true

#firewall setting for rabbitmq
- name: Open RabbitMQ broker port (Celery needs this)
  firewalld:
    port: 5672/tcp
    permanent: true
    state: enabled
    immediate: true
  become: true

- name: Open RabbitMQ management UI port (optional)
  firewalld:
    port: 15672/tcp
    permanent: true
    state: enabled
    immediate: true
  become: true

# --- Proteome data storage: samtools FASTA indexing (faidx) ---

- name: Install samtools
  dnf:
    name: samtools
    state: present
    update_cache: yes
  become: true

- name: Ensure FASTA exists on host
  stat:
    path: /data/proteins/UP000000589_10090.fasta
  register: fasta_stat
  become: true

- name: Fail if FASTA is missing
  fail:
    msg: "FASTA not found at /data/proteins/UP000000589_10090.fasta (copy it to this path before indexing)."
  when: not fasta_stat.stat.exists
  become: true

- name: Create FASTA index (.fai) using samtools faidx
  command: "samtools faidx /data/proteins/UP000000589_10090.fasta"
  args:
    creates: "/data/proteins/UP000000589_10090.fasta.fai"
  become: true

- name: Verify FASTA index exists
  stat:
    path: /data/proteins/UP000000589_10090.fasta.fai
  register: fai_stat
  become: true

- name: Print FASTA index status
  debug:
    msg: "FASTA index exists: {{ fai_stat.stat.exists }} at /data/proteins/UP000000589_10090.fasta.fai"
