---
# roles/host/tasks/main.yml

- name: Install RabbitMQ and Erlang repositories
  copy:
    dest: /etc/yum.repos.d/rabbitmq.repo
    content: |
      ##
      ## Erlang (RabbitMQ runtime)
      ##
      [modern-erlang]
      name=modern-erlang-el9
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/$basearch
              https://yum2.rabbitmq.com/erlang/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      [modern-erlang-noarch]
      name=modern-erlang-el9-noarch
      baseurl=https://yum1.rabbitmq.com/erlang/el/9/noarch
              https://yum2.rabbitmq.com/erlang/el/9/noarch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-erlang.E495BB49CC4BBE5B.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      ##
      ## RabbitMQ Server
      ##
      [rabbitmq-el9]
      name=rabbitmq-el9
      baseurl=https://yum2.rabbitmq.com/rabbitmq/el/9/$basearch
              https://yum1.rabbitmq.com/rabbitmq/el/9/$basearch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

      [rabbitmq-el9-noarch]
      name=rabbitmq-el9-noarch
      baseurl=https://yum2.rabbitmq.com/rabbitmq/el/9/noarch
              https://yum1.rabbitmq.com/rabbitmq/el/9/noarch
      repo_gpgcheck=1
      enabled=1
      gpgkey=https://github.com/rabbitmq/signing-keys/releases/download/3.0/cloudsmith.rabbitmq-server.9F4587F226208342.key
             https://github.com/rabbitmq/signing-keys/releases/download/3.0/rabbitmq-release-signing-key.asc
      gpgcheck=1
      sslverify=1
      sslcacert=/etc/pki/tls/certs/ca-bundle.crt
      metadata_expire=300
      pkg_gpgcheck=1
      autorefresh=1
      type=rpm-md

- name: Install RabbitMQ server
  dnf:
    name: rabbitmq-server
    state: present
    update_cache: yes

- name: Enable and start RabbitMQ
  systemd:
    name: rabbitmq-server
    enabled: yes
    state: started

- name: Enable RabbitMQ management UI
  command: rabbitmq-plugins enable rabbitmq_management
  register: mgmt_res
  changed_when: "'Plugin configuration changed' in mgmt_res.stdout"
  failed_when: mgmt_res.rc != 0 and ('already enabled' not in (mgmt_res.stdout | lower))

- name: Restart RabbitMQ if management UI changed
  systemd:
    name: rabbitmq-server
    state: restarted
  when: mgmt_res is changed

# Create celery vhost/user (so you don't rely on guest/guest remotely)
- name: Create celery vhost
  command: rabbitmqctl add_vhost /celery
  register: vhost_res
  failed_when: vhost_res.rc not in [0, 70]
  changed_when: vhost_res.rc == 0

- name: Create celery user
  command: rabbitmqctl add_user celery celerypass
  register: user_res
  failed_when: user_res.rc not in [0, 70]
  changed_when: user_res.rc == 0

- name: Set permissions for celery user
  command: rabbitmqctl set_permissions -p /celery celery ".*" ".*" ".*"

