---
# roles/workers/tasks/main.yml

# -------------------------------
# Extra dependencies for pipeline (WORKERS)
# - S4Pred
# - HH-suite (hhsearch)
# - HHDB (pdb70)
# -------------------------------
- name: Install OS packages needed for downloads/extract
  dnf:
    name:
      - git
      - wget
      - tar
      - gzip
      - bzip2
      - xz
      - python3
      - python3-pip
      - tmux
    state: present
    update_cache: yes
  become: true

- name: Install Python packages (Celery + pipeline deps)
  pip:
    name:
      - celery
      - biopython
      - numpy
      - scipy
      - torch
    executable: pip3
  become: true

# Where the pipeline code will live on each worker
- name: Create pipeline directory
  file:
    path: /opt/protein_pipeline
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"
  become: true

# Copy scripts from the Ansible controller (cw-host) to workers
# IMPORTANT: src paths are on cw-host
- name: Copy pipeline_script.py to workers
  copy:
    src: /home/almalinux/eda-cw/distributed/pipeline_script.py
    dest: /opt/protein_pipeline/pipeline_script.py
    owner: almalinux
    group: almalinux
    mode: "0755"
  become: true

- name: Copy results_parser.py to workers
  copy:
    src: /home/almalinux/eda-cw/distributed/results_parser.py
    dest: /opt/protein_pipeline/results_parser.py
    owner: almalinux
    group: almalinux
    mode: "0644"

# (Optional) copy select_ids.py too if you use it on workers
- name: Copy select_ids.py to workers
  copy:
    src: /home/almalinux/eda-cw/distributed/select_ids.py
    dest: /opt/protein_pipeline/select_ids.py
    owner: almalinux
    group: almalinux
    mode: "0644"
  ignore_errors: yes

# Celery worker for the protein pipeline (receives tasks from RabbitMQ on the host)

- name: Copy pipeline_tasks.py to workers (Celery task module)
  copy:
    src: /home/almalinux/eda-cw/distributed/pipeline_tasks.py
    dest: /opt/protein_pipeline/pipeline_tasks.py
    owner: almalinux
    group: almalinux
    mode: "0644"

- name: Write protein-pipeline environment file on workers
  copy:
    dest: /etc/sysconfig/protein-pipeline
    mode: "0644"
  content: |
    CELERY_BROKER_URL=amqp://celery:celerypass@10.134.12.197:5672//celery
    PIPELINE_DIR=/opt/protein_pipeline
    RESULTS_ROOT=/data/results
    WORK_ROOT=/tmp/protein_work
  become: true

# IMPORTANT: force concurrency=1 to avoid tmp.* collisions
- name: Install systemd unit for celery worker
  copy:
    dest: /etc/systemd/system/celery-worker.service
    mode: "0644"
    content: |
      [Unit]
      Description=Celery Worker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/protein_pipeline
      EnvironmentFile=/etc/sysconfig/protein-pipeline
      ExecStart=/usr/bin/python3 -m celery -A pipeline_tasks worker --loglevel=INFO --concurrency=4 --prefetch-multiplier=1
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  become: true

- name: Reload systemd
  systemd:
    daemon_reload: yes
  become: true

- name: Enable and start celery worker
  systemd:
    name: celery-worker
    enabled: yes
    state: restarted

- name: Create results and work directories
  file:
    path: "{{ item }}"
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"
  loop:
    - /data/results
    - /tmp/protein_work
  become: true

- name: Copy protein FASTA to workers
  copy:
    src: /home/almalinux/eda-cw/proteome/UP000000589_10090.fasta
    dest: /data/proteins/UP000000589_10090.fasta
    owner: almalinux
    group: almalinux
    mode: "0644"

# ---- S4Pred ----
- name: Install Python deps for S4Pred (system-wide)
  pip:
    name:
      - "biopython>=1.78"
      - "torch"
    executable: pip3
  become: true

- name: Clone S4Pred to /opt/s4pred
  git:
    repo: "https://github.com/psipred/s4pred"
    dest: /opt/s4pred
    version: main
    force: no
  become: true

- name: Download S4Pred weights tarball
  get_url:
    url: "http://bioinfadmin.cs.ucl.ac.uk/downloads/s4pred/weights.tar.gz"
    dest: /opt/s4pred/weights.tar.gz
    mode: "0644"
  become: true

- name: Extract S4Pred weights (creates /opt/s4pred/weights/)
  unarchive:
    src: /opt/s4pred/weights.tar.gz
    dest: /opt/s4pred
    remote_src: yes
  become: true

# ---- HH-suite (hhsearch) ----
- name: Install build deps for HH-suite
  dnf:
    name:
      - cmake
      - gcc
      - gcc-c++
      - make
      - zlib-devel
      - bzip2-devel
    state: present
  become: true

- name: Clone HH-suite
  git:
    repo: "https://github.com/soedinglab/hh-suite"
    dest: /opt/hhsuite-src
    version: master
    force: no
  become: true

- name: Build and install HH-suite
  shell: |
    set -e
    mkdir -p /opt/hhsuite-src/build
    cd /opt/hhsuite-src/build
    cmake -DCMAKE_INSTALL_PREFIX=/opt/hhsuite ..
    make -j"$(nproc)"
    make install
  args:
    creates: /opt/hhsuite/bin/hhsearch
  become: true

- name: Symlink hhsearch into /usr/bin/hhsearch
  file:
    src: /opt/hhsuite/bin/hhsearch
    dest: /usr/bin/hhsearch
    state: link
    force: yes
  become: true


# ---- HHDB (pdb70) ----
- name: Create HHDB directory
  file:
    path: /data/hhdb/pdb70
    state: directory
    mode: "0755"
  become: true

# NOTE: pdb70 is large. This download can take a while and needs disk space.
- name: Download pdb70 database archive (with progress)
  shell: |
    set -euo pipefail
    mkdir -p /data/hhdb/pdb70
    cd /data/hhdb/pdb70
    wget -c --progress=dot:giga \
      "https://wwwuser.gwdguser.de/~compbiol/data/hhsuite/databases/hhsuite_dbs/pdb70_from_mmcif_latest.tar.gz" \
      -O pdb70.tar.gz
  args:
    executable: /bin/bash
  become: true

- name: Extract pdb70 into /data/hhdb/pdb70
  shell: |
    cd /data/hhdb/pdb70
    tar -xf pdb70.tar.gz
  args:
    creates: /data/hhdb/pdb70/pdb70_hhm.ffindex
  become: true
