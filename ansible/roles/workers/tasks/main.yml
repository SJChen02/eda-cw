---
# roles/workers/tasks/main.yml

- name: Install base packages
  dnf:
    name:
      - python3
      - python3-pip
    state: present
    update_cache: yes

- name: Install Celery
  pip:
    name: celery
    executable: pip3

- name: Create app directory
  file:
    path: /opt/celery_test
    state: directory
    mode: "0755"

- name: Drop minimal celery app
  copy:
    dest: /opt/celery_test/celery_app.py
    mode: "0644"
    content: |
      from celery import Celery

      BROKER = "amqp://celery:celerypass@{{ groups['host'][0] }}:5672//celery"
      app = Celery("test", broker=BROKER, backend="rpc://")

      @app.task
      def add(x, y):
          return x + y

- name: Install systemd unit for celery worker
  copy:
    dest: /etc/systemd/system/celery-worker.service
    mode: "0644"
    content: |
      [Unit]
      Description=Celery Worker
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      WorkingDirectory=/opt/celery_test
      ExecStart=/usr/bin/python3 -m celery -A celery_app worker --loglevel=INFO
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Enable and start celery worker
  systemd:
    name: celery-worker
    enabled: yes
    state: started

- name: Create protein data directory
  file:
    path: /data/proteins
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0755"

- name: Copy protein FASTA to workers
  copy:
    src: /home/almalinux/eda-cw/proteome/UP000000589_10090.fasta
    dest: /data/proteins/UP000000589_10090.fasta
    owner: almalinux
    group: almalinux
    mode: "0644"

