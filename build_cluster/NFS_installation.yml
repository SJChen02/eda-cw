---
# -------------------------------
# Controller mounts host NFS share
# -------------------------------

- name: Install NFS client utilities on controller
  dnf:
    name:
      - nfs-utils
    state: present
    update_cache: yes
  become: true

- name: Create mount point on controller
  file:
    path: /eda-cw/pipeline_output
    state: directory
    owner: almalinux
    group: almalinux
    mode: "0775"
  become: true

- name: Mount host NFS share on controller (rw)
  mount:
    path: /eda-cw/pipeline_output
    src: "HOST_IP_OR_NAME:/data/results"
    fstype: nfs
    opts: rw,_netdev,nofail
    state: mounted
  become: true
