---
# --- Remove NFS server ---
- name: Remove NFS export for proteins
  lineinfile:
    path: /etc/exports
    line: "/data/proteins *(ro,sync,no_subtree_check)"
    state: absent
  become: true

- name: Reload NFS exports
  command: exportfs -ra
  become: true

- name: Stop and disable NFS server
  systemd:
    name: nfs-server
    state: stopped
    enabled: no
  become: true

- name: Remove NFS server package
  dnf:
    name: nfs-utils
    state: absent
  become: true

